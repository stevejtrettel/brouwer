name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# NOTE: this repo has diverged from the shared copy in stevejtrettel/threejs-demos.
# It publishes the companion SITE (site/, Astro) with the demos mounted under
# /demos/, not the bare demo gallery. Do not overwrite it by re-running
# `node ../threejs-demos/scripts/add-pages.mjs .` — that would install the
# demos-only workflow again.

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-deployed site is
# worse than a slightly stale one. Queued duplicate pushes collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `npm ci` is the fast, reproducible path, but the lockfile here drifts
      # while the figure work is in flux. Publishing should not be blocked on
      # that, so fall back rather than failing the deploy.
      - run: npm ci || npm install
      - run: npm ci || npm install
        working-directory: site

      # Exposes the site's base path — '' for a custom domain, '/brouwer' if it
      # is ever served as a project page — so the build stays correct either way.
      - uses: actions/configure-pages@v6
        id: pages

      # Builds the demos, the Astro pages and the figure copy in one step,
      # assembling site/dist. See scripts/site.mjs.
      - name: Build site
        run: npm run build:site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
